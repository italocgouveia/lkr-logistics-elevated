<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Brand blue, lifted just enough to stay readable on a dark tab strip. */
    .lkr-blue { fill: #2D4AE8; }
    .lkr-red  { fill: #EF1C24; }
    @media (prefers-color-scheme: dark) {
      .lkr-blue { fill: #5C7BFF; }
      .lkr-red  { fill: #FF3B43; }
    }
  </style>

  <text x="32" y="34" text-anchor="middle" dominant-baseline="central"
        textLength="56" lengthAdjust="spacingAndGlyphs"
        font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="900" font-style="italic" font-size="30">
    <tspan class="lkr-blue">LK</tspan><tspan class="lkr-red">R</tspan>
  </text>
</svg>
